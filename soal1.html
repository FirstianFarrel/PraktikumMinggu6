<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soal 1 - Modul 6</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 320px;
            text-align: center;
            border: 2px solid #60a5fa;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
            font-size: 18px;
        }
        input[type="text"] {
            width: 100%;
            padding: 8px;
            border: none;
            border-bottom: 1px solid #9ca3af;
            text-align: center;
            font-size: 16px;
            outline: none;
            background: transparent;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="form-group">
            <label>Nama</label>
            <input type="text" id="inputNama" readonly>
        </div>
        <div class="form-group">
            <label>NIM</label>
            <input type="text" id="inputNim" readonly>
        </div>
    </div>

    <script>
        // Memunculkan kotak dialog prompt saat halaman dibuka
        let nama = prompt("Masukkan nama kamu:");
        let nim = prompt("Masukkan nim kamu:");

        // Menampilkan inputan ke dalam form jika pengguna mengisi
        if (nama !== null && nama.trim() !== "") {
            document.getElementById("inputNama").value = nama;
        }
        if (nim !== null && nim.trim() !== "") {
            document.getElementById("inputNim").value = nim;
        }
    </script>
</body>
</html>
